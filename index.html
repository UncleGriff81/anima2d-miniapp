<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anima Tasks</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--tg-theme-bg-color, #17212b);
      color: var(--tg-theme-text-color, #e1e5e9);
      margin: 0; padding: 16px; padding-bottom: 80px;
    }
    h1 { font-size: 20px; margin-bottom: 16px; text-align: center; }
    
    .scenario-card { background: var(--tg-theme-secondary-bg-color, #232e3c); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
    .scenario-header { padding: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; color: #64b5f6; }
    .scenario-header:hover { background: rgba(255,255,255,0.05); }
    
    .status-badge { font-size: 11px; padding: 4px 8px; border-radius: 6px; color: #000; font-weight: bold; margin-left: 10px; white-space: nowrap; }
    .status-free { background: #2ecc71; }
    .status-taken { background: #f39c12; }
    .status-completed { background: #7d8b99; color: #fff; }
    
    .scenario-body { display: none; padding: 0 16px 16px 16px; border-top: 1px solid rgba(255,255,255,0.1); }
    .scenario-body.open { display: block; }
    
    .desc { font-size: 14px; margin-top: 12px; margin-bottom: 16px; line-height: 1.4; }
    .scene-block { margin-bottom: 16px; padding-left: 12px; border-left: 2px solid #5288c1; }
    .scene-title { font-weight: bold; font-size: 14px; color: #f39c12; margin-bottom: 4px; }
    .scene-text { font-size: 13px; color: #a0aab5; margin-bottom: 8px; }
    
    .scene-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; margin-top: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); }
    
    .action-btn {
      display: block; width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 8px; 
      font-weight: bold; font-size: 14px; cursor: pointer; text-align: center;
    }
    .btn-select { background: #2ecc71; color: #000; }
    .btn-complete { background: #f39c12; color: #000; }
    .btn-cancel { background: #e74c3c; color: #fff; }
    .btn-upload { background: #3498db; color: #fff; }

    .audio-download-btn {
      display: inline-block; padding: 10px 16px; background: #3498db; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; font-size: 14px;
      text-align: center; margin-top: 8px; cursor: pointer;
    }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-overlay.active { display: flex; }
    .modal-img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--tg-theme-secondary-bg-color, #232e3c); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); }
    .nav-btn { background: none; border: none; color: #7d8b99; font-size: 14px; cursor: pointer; padding: 8px 16px; border-radius: 8px; }
    .nav-btn.active { color: #64b5f6; font-weight: bold; background: rgba(100, 181, 246, 0.1); }
    .empty { text-align: center; color: #7d8b99; margin-top: 20px; }
    .period-header { font-size: 14px; color: #7d8b99; margin: 20px 0 8px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Стили для формы отчёта */
    .report-form { background: var(--tg-theme-secondary-bg-color, #232e3c); padding: 16px; border-radius: 12px; }
    .report-form label { display: block; margin-bottom: 8px; font-size: 14px; color: #7d8b99; }
    .report-form input { width: 100%; padding: 10px; margin-bottom: 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: #fff; font-size: 14px; box-sizing: border-box; }
    .report-form button { width: 100%; padding: 12px; background: #3498db; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🎬 Anima Tasks</h1>

  <div id="scenarios-screen">
    <div id="scenarios-list"><div class="empty">Загрузка...</div></div>
  </div>
  <div id="my-screen" style="display: none;"><div id="my-list"></div></div>
  <div id="all-screen" style="display: none;"><div id="all-list"></div></div>
  <div id="report-screen" style="display: none;">
    <div class="report-form">
      <label>Начало периода:</label>
      <input type="date" id="report-start">
      <label>Конец периода:</label>
      <input type="date" id="report-end">
      <button onclick="downloadReport()">📥 Сформировать отчёт</button>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchScreen('scenarios')">📚 Сценарии</button>
    <button class="nav-btn" onclick="switchScreen('my')">🎞 Мои ролики</button>
    <button class="nav-btn" onclick="switchScreen('users')">👥 Участники</button>
    <button class="nav-btn" onclick="switchScreen('report')">📊 Отчёт</button>
  </div>

  <div id="imageModal" class="modal-overlay" onclick="closeImage()">
    <img id="modalImage" class="modal-img" src="">
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand();
    const userId = tg.initDataUnsafe?.user?.id;
    const API_URL = "https://anima-bot-production.up.railway.app"; 
    const UPLOAD_URL = "https://www.dropbox.com/request/1jwji9n04maopph9i2cp"; // ЗАМЕНИ НА СВОЮ ССЫЛКУ

    async function loadScenarios() {
      try {
        const response = await fetch(`${API_URL}/api/scenarios`);
        const data = await response.json();
        renderScenarios(data.scenarios);
      } catch (e) {
        document.getElementById('scenarios-list').innerHTML = '<div class="empty">Ошибка загрузки.</div>';
      }
    }

    function renderScenarios(scenarios) {
      const list = document.getElementById('scenarios-list');
      list.innerHTML = '';
      if (scenarios.length === 0) { list.innerHTML = '<div class="empty">Пока нет сценариев.</div>'; return; }

      scenarios.forEach(s => {
        let badgeClass = 'status-free'; let badgeText = 'Свободен';
        if (s.status === 'taken') { badgeClass = 'status-taken'; badgeText = 'Занят'; }
        if (s.status === 'completed') { badgeClass = 'status-completed'; badgeText = 'Завершен'; }

        let scenesHtml = '';
        if (s.scenes && s.scenes.length > 0) {
          s.scenes.forEach((scene, idx) => {
            scenesHtml += `
              <div class="scene-block">
                <div class="scene-title">Сцена ${idx + 1}</div>
                <div class="scene-text">${scene.text}</div>
                ${scene.photo ? `<img src="${API_URL}/api/image/${scene.photo}" class="scene-thumb" onclick="openImage('${API_URL}/api/image/${scene.photo}')" />` : ''}
              </div>
            `;
          });
        }

        let audioHtml = '';
        if (s.audio_id) {
            audioHtml = `<div style="margin-top:16px;"><button onclick="downloadAudio('${s.audio_id}')" class="audio-download-btn">⬇️ Скачать аудио</button></div>`;
        }

        let actionBtnHtml = '';
        if (s.status === 'free') {
            actionBtnHtml = `<button class="action-btn btn-select" onclick="selectScenario(${s.id})">✅ Выбрать этот сценарий</button>`;
        } else if (s.status === 'taken' && s.animator_id === userId) {
            actionBtnHtml = `
                <button class="action-btn btn-complete" onclick="completeScenario(${s.id})">✅ Завершить</button>
                <button class="action-btn btn-cancel" onclick="cancelScenario(${s.id})">❌ Отменить</button>
            `;
        } else if (s.status === 'completed' && s.animator_id === userId) {
            actionBtnHtml = `<button class="action-btn btn-upload" onclick="uploadWork(${s.id})">📤 Загрузить</button>`;
        }

        const card = document.createElement('div');
        card.className = 'scenario-card';
        card.innerHTML = `
          <div class="scenario-header" onclick="toggleScenario(this)">
            <span>${s.title}</span>
            <span class="status-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="scenario-body">
            <div class="desc">${s.description || 'Без описания'}</div>
            ${scenesHtml}
            ${audioHtml}
            ${actionBtnHtml}
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function selectScenario(scenarioId) {
        if (!userId) { tg.showAlert("Ошибка: не удалось определить ваш ID"); return; }
        try {
            const response = await fetch(`${API_URL}/api/select_scenario/${scenarioId}?user_id=${userId}`, { method: 'POST' });
            const data = await response.json();
            if (data.success) { tg.showAlert("Сценарий успешно взят в работу!"); loadScenarios(); }
            else { tg.showAlert(data.error || "Не удалось взять сценарий"); loadScenarios(); }
        } catch (e) { tg.showAlert("Ошибка соединения с сервером"); }
    }

    async function cancelScenario(scenarioId) {
        if (!userId) return;
        try {
            const response = await fetch(`${API_URL}/api/cancel_scenario/${scenarioId}?user_id=${userId}`, { method: 'POST' });
            const data = await response.json();
            if (data.success) { tg.showAlert("Сценарий отменен."); loadScenarios(); }
            else { tg.showAlert(data.error || "Ошибка отмены"); }
        } catch (e) { tg.showAlert("Ошибка соединения с сервером"); }
    }

    async function completeScenario(scenarioId) {
        if (!userId) return;
        try {
            const response = await fetch(`${API_URL}/api/complete_scenario/${scenarioId}?user_id=${userId}`, { method: 'POST' });
            const data = await response.json();
            if (data.success) { tg.showAlert("Работа завершена!"); loadScenarios(); }
            else { tg.showAlert(data.error || "Ошибка завершения"); }
        } catch (e) { tg.showAlert("Ошибка соединения с сервером"); }
    }

    function uploadWork(scenarioId) {
        window.open(UPLOAD_URL, '_blank');
        fetch(`${API_URL}/api/upload_work/${scenarioId}?work_link=${encodeURIComponent(UPLOAD_URL)}`, { method: 'POST' });
    }

    function downloadAudio(fileId) {
        const fileUrl = `${API_URL}/api/audio/${fileId}`;
        const fileName = `audio_${fileId}.mp3`;
        if (window.Telegram?.WebApp?.downloadFile) {
            window.Telegram.WebApp.downloadFile({ url: fileUrl, file_name: fileName });
        } else {
            window.open(fileUrl, '_blank');
        }
    }

    function toggleScenario(header) { header.nextElementSibling.classList.toggle('open'); }

    async function loadMyScenarios() {
      if (!userId) return;
      try {
        const response = await fetch(`${API_URL}/api/my_scenarios/${userId}`);
        const data = await response.json();
        const list = document.getElementById('my-list');
        if (data.scenarios.length === 0) { list.innerHTML = '<div class="empty">У вас пока нет роликов.</div>'; return; }
        
        const grouped = {};
        data.scenarios.forEach(s => {
            if (!grouped[s.period]) grouped[s.period] = [];
            grouped[s.period].push(s);
        });

        let html = '';
        const sortedPeriods = Object.keys(grouped).sort().reverse();
        
        sortedPeriods.forEach(period => {
            html += `<div class="period-header">📅 Период: ${period}</div>`;
            grouped[period].forEach(s => {
                const statusClass = s.status === 'completed' ? 'status-completed' : 'status-taken';
                const statusText = s.status === 'completed' ? 'Завершено' : 'В работе';
                html += `
                    <div class="scenario-card">
                    <div class="scenario-header" style="cursor:default;">
                        <span>${s.title}</span>
                        <span class="status-badge ${statusClass}">${statusText}</span>
                    </div>
                    <div class="scenario-body open" style="padding-top:12px;">
                        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;"><span>Дата выбора:</span> <span>${s.selected_at}</span></div>
                        <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;"><span>Дата завершения:</span> <span>${s.completed_at}</span></div>
                        ${s.uploaded_at ? `<div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px;"><span>Дата загрузки:</span> <span>${s.uploaded_at}</span></div>` : ''}
                    </div>
                    </div>
                `;
            });
        });
        list.innerHTML = html;
      } catch (e) { document.getElementById('my-list').innerHTML = '<div class="empty">Ошибка загрузки.</div>'; }
    }

    async function loadUsers() {
      try {
        const response = await fetch(`${API_URL}/api/users`);
        const data = await response.json();
        const list = document.getElementById('all-list');
        if (data.users.length === 0) { list.innerHTML = '<div class="empty">Пока нет участников.</div>'; return; }
        
        let html = '';
        data.users.forEach(u => {
            let roleText = 'Аниматор';
            if (u.role === 'admin') roleText = 'Админ';
            if (u.role === 'scenarist') roleText = 'Сценарист';
            
            html += `
                <div class="scenario-card" style="padding:16px; display:flex; align-items:center; gap:12px;">
                    <div style="flex-shrink:0
