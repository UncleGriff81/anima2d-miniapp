<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anima Tasks</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #17212b;
      color: #e1e5e9;
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .card {
      background: #232e3c;
      border-radius: 12px;
      padding: 16px;
      margin-top: 16px;
    }
    .hint { color: #7d8b99; font-size: 14px; }
    #user { color: #64b5f6; font-weight: 600; }
  </style>
</head>
<body>
  <h1>🎬 Anima Tasks</h1>
  <p class="hint">Заглушка MiniApp. Скоро здесь будут таблицы и сценарии.</p>
  <div class="card">
    <p>Привет, <span id="user">гость</span>!</p>
    <p class="hint" id="status">Инициализация Telegram WebApp...</p>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        document.getElementById('user').textContent = user.first_name || user.username || 'аниматор';
        document.getElementById('status').textContent = 'Telegram WebApp успешно подключён. User ID: ' + user.id;
      } else {
        document.getElementById('status').textContent = 'Открыто вне Telegram (user не передан).';
      }
    } else {
      document.getElementById('status').textContent = 'Telegram WebApp SDK не загружен.';
    }
  </script>
</body>
</html>
